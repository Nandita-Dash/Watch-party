name: Keep awake

# Render's free tier spins a service down after 15 minutes without inbound
# traffic. A cold start then costs the next visitor ~50s, and because free
# instances have no persistent disk the SQLite file resets — so any room codes
# people were already sharing stop working. Regular traffic prevents both.
#
# The interval is 10 minutes rather than 15 on purpose: 15 would race Render's
# own threshold exactly, and GitHub's scheduled runs are best-effort and often
# start several minutes late, which would leave real gaps over the limit.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger a ping by hand from the Actions tab

# If a run is somehow still going when the next is due, don't stack them up.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          PING_URL: ${{ vars.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "PING_URL is not set — nothing to ping yet."
            echo "Add it under: Settings → Secrets and variables → Actions → Variables"
            echo "  Name:  PING_URL"
            echo "  Value: https://<your-service>.onrender.com/api/health"
            exit 0
          fi

          # A sleeping instance takes ~50s to answer, so allow a generous
          # timeout and retry before calling it a genuine outage.
          body=$(mktemp)
          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $PING_URL"

            # Truncated each time: on a connection failure curl writes nothing,
            # and a leftover body would misreport the previous attempt's result.
            : > "$body"
            code=$(curl -sS -o "$body" -w '%{http_code}' \
                     --max-time 90 "$PING_URL") || code="000"

            if [ "$code" = "200" ]; then
              echo "OK ($code): $(cat "$body")"
              exit 0
            fi

            echo "Got HTTP $code"
            if [ -s "$body" ]; then
              head -c 500 "$body"
              echo
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done

          echo "::error::$PING_URL did not return 200 after 3 attempts."
          exit 1
